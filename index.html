<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Our Memory Game ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    h1 {
      color: #d63384;
      margin-bottom: 8px;
      font-size: 2.2rem;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
    }

    .subtitle {
      color: #6c757d;
      margin-bottom: 20px;
      font-size: 1.1rem;
    }

    .stats {
      display: flex;
      gap: 30px;
      margin-bottom: 20px;
      font-weight: bold;
      color: #495057;
      background: rgba(255, 255, 255, 0.6);
      padding: 10px 20px;
      border-radius: 20px;
      backdrop-filter: blur(5px);
    }

    /* Grid Layout */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 85px);
      gap: 10px;
      perspective: 1000px;
    }

    @media (min-width: 480px) {
      .grid {
        grid-template-columns: repeat(4, 110px);
        gap: 15px;
      }
    }

    /* Card 3D Setup */
    .card {
      width: 100%;
      height: 120px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s ease;
      cursor: pointer;
    }

    @media (min-width: 480px) {
      .card {
        height: 140px;
      }
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card.matched {
      transform: rotateY(180deg);
      cursor: default;
      opacity: 0.85;
    }

    .front, .back {
      width: 100%;
      height: 100%;
      position: absolute;
      border-radius: 12px;
      backface-visibility: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Card Back (Hidden State) */
    .back {
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      color: white;
      font-size: 2rem;
      border: 3px solid white;
    }

    /* Card Front (Revealed Image State) */
    .front {
      transform: rotateY(180deg);
      background-color: white;
      overflow: hidden;
      border: 3px solid white;
    }

    .front img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Victory Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: white;
      padding: 30px 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .modal-content h2 {
      color: #d63384;
      margin-bottom: 10px;
    }

    .modal-content button {
      margin-top: 15px;
      padding: 10px 20px;
      border: none;
      background: #ff758c;
      color: white;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Our Memory Game</h1>
  <p class="subtitle">Match all the pairs to unlock a message!</p>

  <div class="stats">
    <div>Turns: <span id="turns">0</span></div>
    <div>Matches: <span id="matches">0</span> / 6</div>
  </div>

  <div class="grid" id="grid"></div>

  <!-- Win Modal -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <h2>You Matched All Our Memories! ❤️</h2>
      <p id="win-message">You remember every moment best.</p>
      <button onclick="restartGame()">Play Again</button>
    </div>
  </div>

  <script>
    // Direct image URLs formatted to bypass cross-domain blocks
    const photos = [
      'https://images.weserv.nl/?url=i.ibb.co/dsS4X0x2/IMG-20260905-223341.jpg',
      'https://images.weserv.nl/?url=i.ibb.co/B5vrc3LF/IMG-20260905-223332.jpg',
      'https://images.weserv.nl/?url=i.ibb.co/CKQdczJD/IMG-20260809-222129.jpg',
      'https://images.weserv.nl/?url=i.ibb.co/6RW5zg3x/IMG-7933.jpg',
      'https://images.weserv.nl/?url=i.ibb.co/S7Dm5RFq/IMG-5276.jpg',
      'https://images.weserv.nl/?url=i.ibb.co/nqqNhjnJ/IMG-7854.jpg'
    ];

    let cardsArray = [...photos, ...photos];
    let firstCard = null;
    let secondCard = null;
    let lockBoard = false;
    let turns = 0;
    let matches = 0;

    const grid = document.getElementById('grid');
    const turnsEl = document.getElementById('turns');
    const matchesEl = document.getElementById('matches');
    const modal = document.getElementById('modal');

    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function createBoard() {
      grid.innerHTML = '';
      shuffle(cardsArray).forEach((imgSrc) => {
        const card = document.createElement('div');
        card.classList.add('card');
        card.dataset.image = imgSrc;

        card.innerHTML = `
          <div class="back">❤️</div>
          <div class="front"><img src="${imgSrc}" alt="Memory" loading="eager"></div>
        `;

        card.addEventListener('click', flipCard);
        grid.appendChild(card);
      });
    }

    function flipCard() {
      if (lockBoard || this === firstCard || this.classList.contains('matched')) return;

      this.classList.add('flipped');

      if (!firstCard) {
        firstCard = this;
        return;
      }

      secondCard = this;
      turns++;
      turnsEl.innerText = turns;
      checkMatch();
    }

    function checkMatch() {
      const isMatch = firstCard.dataset.image === secondCard.dataset.image;

      if (isMatch) {
        disableCards();
      } else {
        unflipCards();
      }
    }

    function disableCards() {
      firstCard.classList.add('matched');
      secondCard.classList.add('matched');
      matches++;
      matchesEl.innerText = matches;

      resetBoard();

      if (matches === photos.length) {
        setTimeout(() => {
          modal.style.display = 'flex';
        }, 500);
      }
    }

    function unflipCards() {
      lockBoard = true;
      setTimeout(() => {
        firstCard.classList.remove('flipped');
        secondCard.classList.remove('flipped');
        resetBoard();
      }, 1000);
    }

    function resetBoard() {
      [firstCard, secondCard, lockBoard] = [null, null, false];
    }

    function restartGame() {
      turns = 0;
      matches = 0;
      turnsEl.innerText = turns;
      matchesEl.innerText = matches;
      modal.style.display = 'none';
      createBoard();
    }

    createBoard();
  </script>
</body>
</html>
